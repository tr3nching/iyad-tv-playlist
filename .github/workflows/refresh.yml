name: Refresh and publish playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playlist-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check playlist handling
        run: npm test
      - name: Retrieve fresh links
        if: ${{ !(github.event_name == 'push' && github.event.head_commit.message == 'Publish initial playlist snapshot') }}
        run: npm run refresh
      - name: Publish previously retrieved snapshot for initial setup
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Publish initial playlist snapshot' }}
        run: node -e "const fs=require('node:fs');for(const file of ['playlist.m3u','status.json'])fs.copyFileSync('bootstrap/'+file,'site/'+file)"
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-site
          path: site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playlist-site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
