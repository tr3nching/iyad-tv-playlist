name: Refresh and publish playlist

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: playlist-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check playlist handling
        run: npm test
      - name: Check program guide handling
        run: python3 scripts/test_update_epg.py
      - name: Restore current assets or checked snapshot
        env:
          PUBLISH_SNAPSHOT: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish playlist snapshot') }}
        run: node scripts/restore-site.mjs
      - name: Retrieve fresh links
        id: streams
        continue-on-error: true
        if: ${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish playlist snapshot')) }}
        run: npm run refresh
      - name: Build program guide
        id: guide
        continue-on-error: true
        run: python3 scripts/update_epg.py --catalog catalog.json --out site
      - name: Record refresh outcomes and check publishing assets
        env:
          PUBLISH_SNAPSHOT: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish playlist snapshot') }}
          STREAM_OUTCOME: ${{ steps.streams.outcome }}
          GUIDE_OUTCOME: ${{ steps.guide.outcome }}
        run: node scripts/record-refresh.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
